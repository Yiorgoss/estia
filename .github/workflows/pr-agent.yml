name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR Agent on pull requests and respond to comments
    steps:
      - name: PR Agent action step
        uses: qodo-ai/pr-agent@main
        env:
          # Credentials
          OPENAI_KEY: ${{ secrets.OPENCODE_API_KEY}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # OPENAI.API_BASE: "https://opencode.ai/inference/go/openai/v1/responses"
          OPENAI.API_BASE: "https://opencode.ai/zen/go/v1"
          CONFIG.MODEL: "openai/deepseek-v4.1-flash"
          CONFIG.FALLBACK_MODELS: '["openai/deepseek-flash-latest", "openai/glm-5.3-flash"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "128000"
          # # Model
          # config.model: "opencode_go/deepseek-v4.1-flash"
          # config.fallback_models: '["opencode_go/deepseek-flash-latest","opencode_go/glm-5.3-flash"]'
          # config.custom_model_max_tokens: "128000"
          

          # Automatic commands on new PRs
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
